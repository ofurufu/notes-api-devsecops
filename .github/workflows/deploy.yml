# .github/workflows/deploy.yml
#
# Deployment Workflow
#
# Triggers when the CD workflow completes successfully.
# Deploys the image built in CD to staging (auto) then production (gated).
#
# Environments:
#   staging    — auto-deploys, no approval required
#   production — requires manual approval from a designated reviewer
#
# NOTE: In this project, "deployment" means pulling and running the Docker
# image on the runner itself (simulated deployment). In a real project this
# step would be replaced with:
#   - kubectl set image ... (Kubernetes)
#   - aws ecs update-service ... (ECS)
#   - fly deploy ... (Fly.io)
#   - ssh + docker pull + docker run (VPS)
# The environment gates, approval flow, and smoke tests are identical
# regardless of which deployment target you use.

name: Deploy

# Trigger 
# Fires when the CD workflow completes.
# 'workflows: ["CD"]' must match the name: field in cd.yml exactly.

on:
  workflow_run:
    workflows: ["CD"]
    types: [completed]
    branches: [main]

# Permissions 
# contents: read    — checkout repo for smoke test scripts
# packages: read    — pull the Docker image from GHCR
# deployments: write — create deployment records in GitHub

permissions:
  contents: read
  packages: read
  deployments: write

# Environment variables 

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Jobs 

jobs:

  # Job 1: Resolve image tag 

  resolve-image:
    name: Resolve Image Tag
    runs-on: ubuntu-latest

    # Only run if CD actually succeeded — same gate pattern as cd.yml
    if: github.event.workflow_run.conclusion == 'success'

    outputs:
      image: ${{ steps.set-image.outputs.image }}
      short-sha: ${{ steps.set-image.outputs.short-sha }}

    steps:
      - name: Compute image reference
        id: set-image
        run: |
          # Extract the 7-character short SHA from the triggering workflow's commit
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)

          # Force lowercase — GHCR requires it
          REPO=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          IMAGE="${{ env.REGISTRY }}/${REPO}:sha-${SHORT_SHA}"

          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT

          echo "Image to deploy: ${IMAGE}"

  # Job 2: Deploy to Staging 
  
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: resolve-image

    # Referencing environment: name here does two things:
    #   1. Links this job to the staging environment in GitHub's UI
    #   2. Applies any protection rules configured for that environment
    #   3. Makes environment secrets available to this job
    environment:
      name: staging
      url: http://localhost:3000   # In real project: your staging URL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Log in to GHCR to pull the image
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Simulate deployment — pull and run the image
      - name: Pull image from GHCR
        run: |
          echo "Pulling image: ${{ needs.resolve-image.outputs.image }}"
          docker pull ${{ needs.resolve-image.outputs.image }}

      - name: Start application (staging)
        run: |
          # Stop any previous staging container
          docker stop notes-staging 2>/dev/null || true
          docker rm   notes-staging 2>/dev/null || true

          # Run the container
          docker run -d \
            --name notes-staging \
            -p 3000:3000 \
            -e NODE_ENV=staging \
            -e APP_VERSION=${{ needs.resolve-image.outputs.short-sha }} \
            ${{ needs.resolve-image.outputs.image }}

          echo "Container started. Waiting for health check..."
          sleep 8   # Give the app time to start

      # Smoke test — minimal check that the service is alive
      # --fail     → exit code 1 on HTTP error (4xx/5xx)
      # --silent   → suppress curl progress output
      # --max-time → timeout after 10 seconds
      # --retry    → retry up to 3 times on transient failures
      - name: Smoke test — health endpoint
        run: |
          echo "Running smoke tests against staging..."

          # Test 1: Health check
          RESPONSE=$(curl --fail --silent --max-time 10 --retry 3 \
            http://localhost:3000/health)
          echo "Health response: $RESPONSE"

          STATUS=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" != "ok" ]; then
            echo "❌ Health check failed — status is '$STATUS', expected 'ok'"
            exit 1
          fi
          echo "✅ Health check passed"

          # Test 2: Notes API responds
          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            http://localhost:3000/api/notes)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Notes API returned HTTP $HTTP_CODE, expected 200"
            exit 1
          fi
          echo "✅ Notes API check passed"

          # Test 3: Create a note end-to-end
          CREATE_RESPONSE=$(curl --fail --silent --max-time 10 \
            -X POST http://localhost:3000/api/notes \
            -H "Content-Type: application/json" \
            -d '{"title":"Smoke Test Note","content":"Deployed via GitHub Actions"}')
          echo "Create note response: $CREATE_RESPONSE"

          TITLE=$(echo $CREATE_RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['title'])")
          if [ "$TITLE" != "Smoke Test Note" ]; then
            echo "❌ Note creation failed"
            exit 1
          fi
          echo "✅ Note creation check passed"

          echo ""
          echo "All staging smoke tests passed ✅"

      - name: Print staging deployment summary
        run: |
          echo "================================================"
          echo "  STAGING DEPLOYMENT SUCCESSFUL"
          echo "================================================"
          echo "  Image:    ${{ needs.resolve-image.outputs.image }}"
          echo "  Commit:   ${{ github.event.workflow_run.head_sha }}"
          echo "  Version:  ${{ needs.resolve-image.outputs.short-sha }}"
          echo "================================================"

      # Always stop the staging container after smoke tests
      # 'if: always()' ensures cleanup runs even if smoke tests fail
      - name: Cleanup staging container
        if: always()
        run: |
          docker stop notes-staging 2>/dev/null || true
          docker rm   notes-staging 2>/dev/null || true
          echo "Staging container cleaned up"

  # Job 3: Deploy to Production
  # Runs only after staging succeeds AND a required reviewer approves.
  # The approval gate is enforced by the 'production' environment configuration.
  #
  # When this job starts, GitHub:
  #   1. Checks the 'production' environment protection rules
  #   2. Sends a notification to all required reviewers
  #   3. PAUSES the job until someone clicks Approve
  #   4. Only then allocates a runner and starts the steps

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [resolve-image, deploy-staging]   # Both must pass before gate opens

    environment:
      name: production
      url: http://localhost:3000   # In real project: https://your-domain.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image from GHCR
        run: |
          echo "Pulling image for production: ${{ needs.resolve-image.outputs.image }}"
          docker pull ${{ needs.resolve-image.outputs.image }}

      - name: Start application (production)
        run: |
          docker stop notes-production 2>/dev/null || true
          docker rm   notes-production 2>/dev/null || true

          docker run -d \
            --name notes-production \
            -p 3001:3000 \
            -e NODE_ENV=production \
            -e APP_VERSION=${{ needs.resolve-image.outputs.short-sha }} \
            ${{ needs.resolve-image.outputs.image }}

          echo "Production container started. Waiting for health check..."
          sleep 8

      # Production smoke test — same checks, different port
      - name: Smoke test — health endpoint (production)
        run: |
          echo "Running smoke tests against production..."

          RESPONSE=$(curl --fail --silent --max-time 10 --retry 3 \
            http://localhost:3001/health)
          echo "Health response: $RESPONSE"

          STATUS=$(echo $RESPONSE | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          if [ "$STATUS" != "ok" ]; then
            echo "❌ Health check failed — status is '$STATUS', expected 'ok'"
            exit 1
          fi
          echo "✅ Health check passed"

          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            http://localhost:3001/api/notes)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Notes API returned HTTP $HTTP_CODE, expected 200"
            exit 1
          fi
          echo "✅ Notes API check passed"

          echo ""
          echo "All production smoke tests passed ✅"

      - name: Print production deployment summary
        run: |
          echo "================================================"
          echo "  PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "================================================"
          echo "  Image:    ${{ needs.resolve-image.outputs.image }}"
          echo "  Commit:   ${{ github.event.workflow_run.head_sha }}"
          echo "  Version:  ${{ needs.resolve-image.outputs.short-sha }}"
          echo "  Approved by: ${{ github.actor }}"
          echo "================================================"

      - name: Cleanup production container
        if: always()
        run: |
          docker stop notes-production 2>/dev/null || true
          docker rm   notes-production 2>/dev/null || true
          echo "Production container cleaned up"

