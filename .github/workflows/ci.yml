name: CI
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'Dockerfile'
      - '.trivyignore'          # Re-run if suppressions change
      - '.github/workflows/**'
      - '.github/actions/**'

  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'Dockerfile'
      - '.trivyignore'
      - '.github/workflows/**'
      - '.github/actions/**'

  workflow_dispatch:
    inputs:
      node-versions:
        description: 'Node.js versions to test (JSON array)'
        required: false
        default: '["20", "22"]'



permissions:
  contents: read            # Clone the repo
  security-events: write    # Upload SARIF to GitHub Security tab

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 'CI Pipeline'
    uses: ./.github/workflows/reusable-ci.yml
    with:
      node-version-matrix: '["20", "22"]'   # hardcoded — safe for all triggers
      node-version-lint: '20'
      run-coverage: true
      audit-level: 'high'
